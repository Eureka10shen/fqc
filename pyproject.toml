[project]
name = "fqc"
version = "0.1.0"
description = "First quantum computing repo."
readme = "README.md"
authors = [
    { name = "fangshen.727", email = "fangshen.727@bytedance.com" }
]
requires-python = ">=3.12, <3.13"
dependencies = [
    "aiohttp",
    "fsspec",
    "h5py",
    "jax==0.4.20",
    "jaxlib==0.4.20",
    "numpy==1.26.4",
    "pennylane==0.41.1",
    "pennylane-lightning==0.41.1",
    "autoray>=0.6.11,<0.8",
    "qiskit-aer>=0.17.2",
    "qiskit-ibm-runtime>=0.50.0",
    "qiskit[visualization]==2.4.2",
    "optax==0.2.2",
    "scipy==1.12",
]

[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"
